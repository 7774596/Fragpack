name: CPU checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.20'
      - name: Install CPU PyTorch and development tools
        run: |
          python -m pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check fragpack tests benchmarks
      - name: Formatting
        run: ruff format --check fragpack tests benchmarks
      - name: CPU contracts
        env:
          PYTHONHASHSEED: '0'
        run: pytest -q tests/unit
