<svg xmlns="http://www.w3.org/2000/svg" width="178mm" height="64.403636mm" viewBox="0 0 1100 398" role="img" aria-labelledby="title desc">
  <title id="title">KVFold pool and tier integration paths</title>
  <desc id="desc">Pool mode uses compressed GPU records for prefill and decode. Tier mode keeps native BF16 and uses a server GPU codec. Aligned dashed lines separate the vLLM worker process from the LMCache cache-server process. Both modes use exact-length external allocation and existing cache policies, described in the figure caption.</desc>
