<svg xmlns="http://www.w3.org/2000/svg" width="178mm" height="63.594545mm" viewBox="0 0 1100 393" role="img" aria-labelledby="title desc">
<title id="title">KVFold pool and tier integration paths</title>
<desc id="desc">Pool mode keeps closed blocks compressed on the GPU, decodes them into a BF16 workspace for FA3 prefill, reconstructs them in registers for decode attention, and exports the same KVFold records to LMCache without re-encoding. Tier mode keeps native BF16 pages and FA3; the LMCache server applies a GPU codec before DRAM and NVMe. Dashed lines separate the vLLM worker and LMCache cache-server processes.</desc>
<rect id="canvas" x="0" y="0" width="1100" height="393" fill="white"/>
<g id="pool-mode">
<clipPath id="pool-clip"><rect x="1" y="1" width="1098" height="227" rx="8"/></clipPath>
<g clip-path="url(#pool-clip)">
<rect id="pool-worker-bg" x="1" y="1" width="629" height="227" rx="0" fill="white" stroke="none"/>
<rect id="pool-server-bg" x="630" y="1" width="470" height="227" rx="0" fill="#F7F9FC" stroke="none"/>
<rect id="pool-accent" x="1" y="1" width="5" height="227" rx="0" fill="#246AC0" stroke="none"/>
</g>
<rect id="pool-frame" x="1" y="1" width="1098" height="227" rx="8" fill="none" stroke="#C9D3DF" stroke-width="1.1"/>
<text id="pool-title" x="20" y="28" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#246AC0" text-anchor="start">Pool mode</text>
<text id="pool-worker-label" x="612" y="28" font-family="Liberation Sans, Arial, sans-serif" font-size="18.5" font-weight="400" fill="#586779" text-anchor="end">vLLM worker / GPU</text>
<text id="pool-server-label" x="648" y="28" font-family="Liberation Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#202C3A" text-anchor="start">LMCache cache server</text>
<line id="pool-header-rule" x1="20" y1="41" x2="1082" y2="41" stroke="#E1E7EE" stroke-width="1"/>
<line id="pool-process-boundary" x1="630" y1="11" x2="630" y2="218" stroke="#AAB8C7" stroke-width="1.1" stroke-dasharray="5,4"/>
<g id="fragpack-pool">
<rect id="pool-layer-1" x="36" y="87" width="150" height="60" rx="4" fill="#DBE8F8" stroke="#9BB9DF" stroke-width="1.1"/>
<rect id="pool-layer-2" x="32" y="91" width="150" height="60" rx="4" fill="#E5EFFA" stroke="#739ECD" stroke-width="1.1"/>
